{% extends "base.html" %}


{% block title %}

Export Complete | ComicCraft

{% endblock %}


{% block content %}


<section class="card success">


    <div class="success-icon">
        ✓
    </div>


    <h1>
        Comic Export Ready!
    </h1>


    <p>
        Your ComicCraft PDF has been
        generated successfully.
    </p>


    <div class="actions">


        <a
            class="button"
            href="/export/{{ comic_id }}"
        >

            Download PDF

        </a>


        <a
            class="button secondary"
            href="/"
        >

            Go Create Another Comic

        </a>


    </div>


</section>


{% endblock %}
